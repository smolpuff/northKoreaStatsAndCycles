name: Build Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build or retry (v0.1.1)
        required: true
        type: string
      replace_existing:
        description: Explicitly replace this published version after its build and tests pass
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPLACE_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_existing || false }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Require release commit on main
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Manual releases must run from main. Dev is code only."
          }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Cannot verify main" }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag is not on main. Promote dev to main before releasing." }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate tag and all version files
        run: node scripts/release.mjs --check --tag "$env:RELEASE_TAG"

      - name: Require explicit manual opt-in to replace a published release
        shell: pwsh
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($existing | ConvertFrom-Json).isDraft -and $env:REPLACE_EXISTING -ne 'true') {
            throw "This version is already published. Create a new version, or explicitly select replace_existing in a manual run."
          }
          $global:LASTEXITCODE = 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows application
        run: npm.cmd --% run build -- --ci --target x86_64-pc-windows-msvc

      - name: Run backend regression tests before publishing
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib --target x86_64-pc-windows-msvc

      - name: Prepare release files and verified updater manifest
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $binary = "src-tauri/target/x86_64-pc-windows-msvc/release/marbles-stats.exe"
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath $binary -Destination release-assets/marbles-stats.exe
          node scripts/create-update-manifest.mjs release-assets/marbles-stats.exe "release-assets/v$version.json"
          if ($LASTEXITCODE -ne 0) { throw "Update manifest generation failed" }
          $metadata = Get-Content version.json -Raw | ConvertFrom-Json
          $notes = @($metadata.notes) | Where-Object { $_ -and $_.Trim() } | ForEach-Object { "- $_" }
          $body = "## Marbles Stats $env:RELEASE_TAG`n`n" + ($notes -join "`n") + "`n`nWindows x64. Download marbles-stats.exe and run it. This is the only application download; no separate installer is needed. Update metadata is stored in the repository.`n"
          Set-Content release-assets/release-notes.md -Value $body -Encoding utf8

      - name: Keep build artifacts for recovery
        uses: actions/upload-artifact@v7
        with:
          name: marbles-stats-${{ env.RELEASE_TAG }}-windows-x64
          path: release-assets/*
          if-no-files-found: error

      - name: Temporarily unpublish the explicitly requested replacement
        if: github.event_name == 'workflow_dispatch' && inputs.replace_existing
        run: |
          gh release edit "$env:RELEASE_TAG" --draft=true
          if ($LASTEXITCODE -ne 0) { throw "Could not make the existing release a draft; its downloads will not be replaced" }

      - name: Upload all files to a draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Marbles Stats ${{ env.RELEASE_TAG }}
          draft: true
          body_path: release-assets/release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-assets/marbles-stats.exe

      - name: Publish only after all downloads are uploaded
        run: |
          gh release edit "$env:RELEASE_TAG" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed; repository update metadata will not be published" }

      - name: Publish verified download metadata in the repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $manifest = [IO.Path]::GetFullPath("release-assets/v$version.json")
          # A separate checkout preserves the build tree. Merge current branch
          # tips and push atomically: never overwrite concurrent development.
          git fetch origin +refs/heads/main:refs/remotes/origin/main +refs/heads/dev:refs/remotes/origin/dev
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch current branches" }
          git worktree add --detach metadata-publish origin/main
          if ($LASTEXITCODE -ne 0) { throw "Cannot create metadata checkout" }
          Push-Location metadata-publish
          try {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            New-Item -ItemType Directory -Path updates -Force | Out-Null
            Copy-Item -LiteralPath $manifest -Destination "updates/v$version.json"
            git add -- "updates/v$version.json"
            if ($LASTEXITCODE -ne 0) { throw "Cannot stage updater metadata" }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 1) {
              git commit -m "Publish verified update metadata for v$version" -m 'Store the exact release EXE URL, byte size and SHA-256 in the repository after the download is public. Release downloads contain only the application.'
              if ($LASTEXITCODE -ne 0) { throw "Cannot commit updater metadata" }
            } elseif ($LASTEXITCODE -ne 0) { throw "Cannot inspect metadata changes" }
            $mainCommit = git rev-parse HEAD
            git checkout --detach origin/dev
            if ($LASTEXITCODE -ne 0) { throw "Cannot check out development branch" }
            git merge --no-edit $mainCommit
            if ($LASTEXITCODE -ne 0) { throw "Merge current main into dev before retrying metadata publication; no remote branch was changed" }
            git push --atomic origin "${mainCommit}:refs/heads/main" HEAD:refs/heads/dev
            if ($LASTEXITCODE -ne 0) { throw "Branches changed during publication. Retry this step; no branch was overwritten" }
          } finally { Pop-Location }
