name: Check development

on:
  push:
    branches: [dev]
    paths-ignore:
      - updates/**
      - version.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - name: Check frontend types
        run: npx tsc --noEmit
      - name: Check all version files
        run: node scripts/release.mjs --check
      - name: Run all backend regression tests
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib --target x86_64-pc-windows-msvc
