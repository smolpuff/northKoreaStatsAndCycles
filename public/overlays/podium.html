<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marbles Stats - Race and Battle Royale podium</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body data-overlay="podium">
  <!-- Edit this HTML to customize the design. {} values are filled by overlay.js. -->
  <main id="overlay" hidden aria-live="polite">
    <section class="card">
      <header class="heading"><i class="icon" data-show="isRace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V3m0 1c5-4 10 4 16 0v11c-6 4-11-4-16 0M4 9.5c5-4 10 4 16 0M9 3.5v11m6-10v11"/></svg></i><i class="icon" data-show="br"><svg aria-hidden="true" fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><!--! Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free (Icons: CC BY 4.0, Fonts: SIL OFL 1.1, Code: MIT License) Copyright 2024 Fonticons, Inc. --><path d="M192 0c17.7 0 32 14.3 32 32l0 112-64 0 0-112c0-17.7 14.3-32 32-32zM64 64c0-17.7 14.3-32 32-32s32 14.3 32 32l0 80-64 0 0-80zm192 0c0-17.7 14.3-32 32-32s32 14.3 32 32l0 96c0 17.7-14.3 32-32 32s-32-14.3-32-32l0-96zm96 64c0-17.7 14.3-32 32-32s32 14.3 32 32l0 64c0 17.7-14.3 32-32 32s-32-14.3-32-32l0-64zm-96 88l0-.6c9.4 5.4 20.3 8.6 32 8.6c13.2 0 25.4-4 35.6-10.8c8.7 24.9 32.5 42.8 60.4 42.8c11.7 0 22.6-3.1 32-8.6l0 8.6c0 52.3-25.1 98.8-64 128l0 96c0 17.7-14.3 32-32 32l-160 0c-17.7 0-32-14.3-32-32l0-78.4c-17.3-7.9-33.2-18.8-46.9-32.5L69.5 357.5C45.5 333.5 32 300.9 32 267l0-27c0-35.3 28.7-64 64-64l88 0c22.1 0 40 17.9 40 40s-17.9 40-40 40l-56 0c-8.8 0-16 7.2-16 16s7.2 16 16 16l56 0c39.8 0 72-32.2 72-72z"/></svg></i><div><h1>{race} podium</h1><p class="subtitle">{mapName}</p></div><span class="brand">{brand}</span></header>
      <div class="podium-results">
        <table>
          <thead><tr><th>#</th><th>Player</th><th data-show="br">Kills</th><th data-show="br">Damage</th><th>Points</th></tr></thead>
          <tbody data-repeat="placements" data-key="playerKey" data-limit="3">
          <template>
            <tr data-class="winner:winner dead:dead">
              <td>
                <i class="rank-icon" data-show="winner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v5a5 5 0 0 1-10 0V3ZM7 5H3v3a4 4 0 0 0 4 4m10-7h4v3a4 4 0 0 1-4 4M12 13v5m-4 3h8m-7-3h6v3H9Z"/></svg></i>
                <i class="rank-icon" data-show="dead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21v-3H7v-4a8 8 0 1 1 10 0V3ZM12 18v3"/><circle cx="9" cy="10" r="1.5"/><circle cx="15" cy="10" r="1.5"/></svg></i>
                <span data-show="ordinary">{place}</span>
              </td>
              <td><span class="name" title="{name}">{name}</span></td>
              <td data-show="br"><span data-number="kills">{kills}</span></td>
              <td data-show="br"><span data-number="damage">{damage}</span></td>
              <td class="points"><span data-number="points">{points}</span></td>
            </tr>
          </template>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="overlay-config.js"></script>
  <!-- Data loading and bindings only; this script does not generate the layout. -->
  <script src="overlay.js"></script>
</body>
</html>
