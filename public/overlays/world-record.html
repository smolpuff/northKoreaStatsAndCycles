<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marbles Stats - World record</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body data-overlay="world-record">
  <!-- Edit this HTML to customize the design. {} values are filled by overlay.js. -->
  <main id="overlay" hidden aria-live="polite">
    <section class="card celebration record">
      <div class="party-lights record-lights" aria-hidden="true">
        <div class="laser-bank laser-left"><i class="laser-beam" style="--beam:0"></i><i class="laser-beam" style="--beam:1"></i><i class="laser-beam" style="--beam:2"></i><i class="laser-beam" style="--beam:3"></i><i class="laser-beam" style="--beam:4"></i><i class="laser-beam" style="--beam:5"></i><i class="laser-beam" style="--beam:6"></i><i class="laser-beam" style="--beam:7"></i><i class="laser-beam" style="--beam:8"></i><i class="laser-beam" style="--beam:9"></i><i class="laser-beam" style="--beam:10"></i><i class="laser-beam" style="--beam:11"></i></div>
        <div class="laser-bank laser-right"><i class="laser-beam" style="--beam:0"></i><i class="laser-beam" style="--beam:1"></i><i class="laser-beam" style="--beam:2"></i><i class="laser-beam" style="--beam:3"></i><i class="laser-beam" style="--beam:4"></i><i class="laser-beam" style="--beam:5"></i><i class="laser-beam" style="--beam:6"></i><i class="laser-beam" style="--beam:7"></i><i class="laser-beam" style="--beam:8"></i><i class="laser-beam" style="--beam:9"></i><i class="laser-beam" style="--beam:10"></i><i class="laser-beam" style="--beam:11"></i></div>
        <i class="party-spotlight spotlight-one"></i><i class="party-spotlight spotlight-two"></i>
        <i class="party-spotlight spotlight-three"></i><i class="party-spotlight spotlight-four"></i>
        <div class="party-halo"></div>
        <i class="record-light-ring"></i><i class="record-light-ring ring-two"></i>
      </div>
      <div class="confetti" data-confetti="400" aria-hidden="true">
        <template><i class="confetti-piece"></i></template>
      </div>
      <div class="celebration-content">
        <i class="celebration-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v5a5 5 0 0 1-10 0V3ZM7 5H3v3a4 4 0 0 0 4 4m10-7h4v3a4 4 0 0 1-4 4M12 13v5m-4 3h8m-7-3h6v3H9Z"/></svg></i>
        <h1>World Record!</h1>
        <p class="celebration-time" data-show="hasRecordPoints">+<span data-number="wrplayerpoints">{wrplayerpoints}</span> points</p>
        <p class="celebration-player">{wrplayer}</p>
        <p class="celebration-track">{mapName}</p>
        <p class="celebration-points" data-number="wrrecordtime" data-decimals="3" data-suffix="s">{wrrecordtime}</p>
      </div>
    </section>
  </main>
  <script src="overlay-config.js"></script>
  <!-- Data loading and bindings only; this script does not generate the layout. -->
  <script src="overlay.js"></script>
</body>
</html>
