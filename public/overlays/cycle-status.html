<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marbles Stats - Cycle standings</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body data-overlay="cycle-status">
  <main id="overlay" hidden aria-live="polite">
    <section class="card">
      <header class="heading"><i class="icon" aria-label="Race"><svg class="phosphor-icon" aria-hidden="true" data-icon="flag-checkered" data-weight="regular" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M227.32,48.75A8,8,0,0,0,218.76,50c-28,24.22-51.72,12.48-79.21-1.13C111.07,34.76,78.78,18.79,42.76,50A8,8,0,0,0,40,56V224a8,8,0,0,0,16,0V179.77c26.79-21.16,49.87-9.75,76.45,3.41,28.49,14.09,60.77,30.06,96.79-1.13a8,8,0,0,0,2.76-6V56A8,8,0,0,0,227.32,48.75ZM216,71.6v40.65c-14,11.06-27,13.22-40,10.88V79.34A60.05,60.05,0,0,0,216,71.6Zm-56,3.76v43c-6.66-2.67-13.43-6-20.45-9.48-8.82-4.37-18-8.91-27.55-12.18v-43c6.66,2.66,13.43,6,20.45,9.48C141.27,67.55,150.46,72.09,160,75.36ZM96,48.91V92.69a60.06,60.06,0,0,0-40,7.75V59.78C70,48.72,83,46.57,96,48.91ZM86.58,152A60.06,60.06,0,0,0,56,160.43V119.78c14-11.06,27-13.22,40-10.88v43.8A65.61,65.61,0,0,0,86.58,152ZM112,156.67v-43c6.66,2.66,13.43,6,20.45,9.48,8.82,4.37,18,8.9,27.55,12.17v43c-6.66-2.67-13.43-6-20.45-9.48C130.73,164.47,121.54,159.94,112,156.67Zm64,26.45v-43.8a65.61,65.61,0,0,0,9.42.72A60.11,60.11,0,0,0,216,131.57v40.68C202,183.31,189,185.46,176,183.12Z"/></svg></i><div><h1>Cycle standings</h1><p class="subtitle">{cycleSeasonName} · {cyclePlayers} players · Green = collected</p></div><span class="brand">{brand}</span></header>
      <div class="results-viewport">
        <table>
          <thead><tr><th>#</th><th>Player</th><th>Cycles</th><th>Progress</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th><th>Left</th></tr></thead>
          <tbody data-repeat="cycleStandings" data-key="playerKey">
            <template>
              <tr>
                <td>{rank}</td>
                <td><span class="name" title="{playerName}">{playerName}</span></td>
                <td class="cycle-total">{cycles}</td>
                <td class="cycle-progress" title="Next cycle: {progress}">{progress}</td>
                <td data-class="ready:position1.ready">{position1.count}</td>
                <td data-class="ready:position2.ready">{position2.count}</td>
                <td data-class="ready:position3.ready">{position3.count}</td>
                <td data-class="ready:position4.ready">{position4.count}</td>
                <td data-class="ready:position5.ready">{position5.count}</td>
                <td data-class="ready:position6.ready">{position6.count}</td>
                <td data-class="ready:position7.ready">{position7.count}</td>
                <td data-class="ready:position8.ready">{position8.count}</td>
                <td data-class="ready:position9.ready">{position9.count}</td>
                <td data-class="ready:position10.ready">{position10.count}</td>
                <td class="cycle-left" title="Positions left: {missingPositions}">{left}</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="overlay-config.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
