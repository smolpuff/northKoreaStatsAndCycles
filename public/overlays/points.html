<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marbles Stats - Match and session points</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body data-overlay="points">
  <!-- Edit this HTML to customize the design. {} values are filled by overlay.js. -->
  <main id="overlay" hidden aria-live="polite">
    <section class="card">
      <header class="heading"><i class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg></i><div><h1>Points earned</h1><p class="subtitle">{mapName}</p></div><span class="brand">{brand}</span></header>
      <div class="totals">
        <div class="metric"><small>This match</small><strong data-number="matchPoints">{matchPoints}</strong></div>
        <div class="metric"><small>This session</small><strong data-number="sessionPoints">{sessionPoints}</strong></div>
      </div>
      <p class="foot">Race + Battle Royale &middot; Season total: <span data-number="seasonPoints">{seasonPoints}</span></p>
    </section>
  </main>
  <script src="overlay-config.js"></script>
  <!-- Data loading and bindings only; this script does not generate the layout. -->
  <script src="overlay.js"></script>
</body>
</html>
