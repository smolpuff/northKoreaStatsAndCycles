<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marbles Stats - Race and Battle Royale results</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body data-overlay="results">
  <!-- Edit this HTML to customize the design. {} values are filled by overlay.js. -->
  <main id="overlay" hidden aria-live="polite">
    <section class="card">
      <header class="heading"><i class="icon" data-show="isRace" aria-label="Race"><svg class="phosphor-icon" aria-hidden="true" data-icon="flag-checkered" data-weight="regular" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M227.32,48.75A8,8,0,0,0,218.76,50c-28,24.22-51.72,12.48-79.21-1.13C111.07,34.76,78.78,18.79,42.76,50A8,8,0,0,0,40,56V224a8,8,0,0,0,16,0V179.77c26.79-21.16,49.87-9.75,76.45,3.41,28.49,14.09,60.77,30.06,96.79-1.13a8,8,0,0,0,2.76-6V56A8,8,0,0,0,227.32,48.75ZM216,71.6v40.65c-14,11.06-27,13.22-40,10.88V79.34A60.05,60.05,0,0,0,216,71.6Zm-56,3.76v43c-6.66-2.67-13.43-6-20.45-9.48-8.82-4.37-18-8.91-27.55-12.18v-43c6.66,2.66,13.43,6,20.45,9.48C141.27,67.55,150.46,72.09,160,75.36ZM96,48.91V92.69a60.06,60.06,0,0,0-40,7.75V59.78C70,48.72,83,46.57,96,48.91ZM86.58,152A60.06,60.06,0,0,0,56,160.43V119.78c14-11.06,27-13.22,40-10.88v43.8A65.61,65.61,0,0,0,86.58,152ZM112,156.67v-43c6.66,2.66,13.43,6,20.45,9.48,8.82,4.37,18,8.9,27.55,12.17v43c-6.66-2.67-13.43-6-20.45-9.48C130.73,164.47,121.54,159.94,112,156.67Zm64,26.45v-43.8a65.61,65.61,0,0,0,9.42.72A60.11,60.11,0,0,0,216,131.57v40.68C202,183.31,189,185.46,176,183.12Z"/></svg></i><i class="icon" data-show="br" aria-label="Battle Royale"><svg class="phosphor-icon" aria-hidden="true" data-icon="sword" data-weight="regular" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M216,32H152a8,8,0,0,0-6.34,3.12l-64,83.21L72,108.69a16,16,0,0,0-22.64,0l-12.69,12.7a16,16,0,0,0,0,22.63l20,20-28,28a16,16,0,0,0,0,22.63l12.69,12.68a16,16,0,0,0,22.62,0l28-28,20,20a16,16,0,0,0,22.64,0l12.69-12.7a16,16,0,0,0,0-22.63l-9.64-9.64,83.21-64A8,8,0,0,0,224,104V40A8,8,0,0,0,216,32ZM52.69,216,40,203.32l28-28L80.68,188Zm70.61-8L48,132.71,60.7,120,136,195.31ZM208,100.06l-81.74,62.88L115.32,152l50.34-50.34a8,8,0,0,0-11.32-11.31L104,140.68,93.07,129.74,155.94,48H208Z"/></svg></i><div><h1>{race} results</h1><p class="subtitle">{mapName}</p></div><span class="brand">{brand}</span></header>
      <div class="results-viewport">
        <table>
          <thead><tr><th>#</th><th>Player</th><th data-show="br">Kills</th><th data-show="br">Damage</th><th>Points</th></tr></thead>
          <tbody data-repeat="placements" data-key="playerKey">
          <template>
            <tr data-class="winner:winner dead:dead world-record:worldRecord">
              <td>
                <i class="rank-icon" data-show="winner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v5a5 5 0 0 1-10 0V3ZM7 5H3v3a4 4 0 0 0 4 4m10-7h4v3a4 4 0 0 1-4 4M12 13v5m-4 3h8m-7-3h6v3H9Z"/></svg></i>
                <i class="rank-icon" data-show="dead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21v-3H7v-4a8 8 0 1 1 10 0V3ZM12 18v3"/><circle cx="9" cy="10" r="1.5"/><circle cx="15" cy="10" r="1.5"/></svg></i>
                <span data-show="ordinary">{place}</span>
              </td>
              <td><span class="player-label"><span class="name" title="{name}">{name}</span><span class="world-record-badge" data-show="worldRecord" title="Confirmed world record">WR</span></span></td>
              <td data-show="br"><span data-number="kills">{kills}</span></td>
              <td data-show="br"><span data-number="damage">{damage}</span></td>
              <td class="points"><span data-number="points">{points}</span></td>
            </tr>
          </template>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="overlay-config.js"></script>
  <!-- Data loading and bindings only; this script does not generate the layout. -->
  <script src="overlay.js"></script>
</body>
</html>
