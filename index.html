<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marbles Stats</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #040812;
        color: #e8edf6;
        font-family: "Segoe UI", sans-serif;
      }

      .startup {
        display: grid;
        width: 100%;
        height: 100%;
        place-content: center;
        justify-items: center;
        gap: 12px;
      }

      .startup-spinner {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #ff4d94;
        border-radius: 50%;
        animation: startup-spin 0.7s linear infinite;
      }

      .startup strong {
        font-size: 13px;
      }

      .startup span {
        color: #8490a4;
        font-size: 10px;
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <div class="startup">
        <div class="startup-spinner"></div>
        <strong>Marbles Stats</strong>
        <span>Starting local race monitor…</span>
      </div>
    </div>
  </body>
</html>
